# Nginx конфиг для platformlove.com
# Поместить в /etc/nginx/sites-available/platformlove.com
# Затем: ln -s /etc/nginx/sites-available/platformlove.com /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name platformlove.com www.platformlove.com;

    # Frontend (Vite build)
    root /var/www/platformlove.com/dist;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API проксирование на Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Загруженные файлы
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Скрытые файлы (.env, .git и т. п.) наружу не отдаём.
    # root — это dist, поэтому server/.env туда и так не попадает, но явный
    # запрет страхует от смены root, появления symlink'ов и ручных правок.
    # /.well-known/acme-challenge оставляем: им пользуется Certbot.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Кэширование статики
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}

